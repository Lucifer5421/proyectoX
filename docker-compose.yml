services:
  # ==========================================================
  # BASE DE DATOS DEL PROYECTO (PostgreSQL)
  # Independiente del MySQL del servidor WoW.
  # ==========================================================
  postgres-db:
    image: postgres:15-alpine
    container_name: proyectoX-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proyectoX-network

  # ==========================================================
  # APLICACIÓN (FastAPI + SQLAlchemy)
  # ==========================================================
  auction-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proyectoX-app
    restart: always
    ports:
      - "${APP_PORT}:8002"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
    volumes:
      - ./src:/app/src
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - proyectoX-network

networks:
  proyectoX-network:
    driver: bridge
    name: proyectoX-network

volumes:
  postgres_data:
    driver: local
